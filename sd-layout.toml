to = "roms/AMIGA/bootstat.txt"
mode = "keep"

# Atari ROM pool. Everything in bmx/roms/a800/ is staged 1:1 to
# /roms/ATARI800/ on the SD card (flat, original names kept). At boot the
# atari800 kernel scans /roms/ATARI800 (falling back to legacy /roms/atari800 and /roms) and
# matches OS/BASIC/5200/drive ROMs by CRC32/size, so filenames do not
# matter and different machine models each find their ROMs. The kernel
# boots zero-config from compiled-in Altirra ROMs when nothing matches, so
# an empty source directory is fine and stays silent (no features flag, no
# MISSING-ROMS spam).
[[both.tree]]
from = "repo/roms/a800"
to = "roms/ATARI800"
mode = "keep"
exclude = ["README.txt"]

# Kickstart pool for the AMIGA machine. Everything in repo roms/amiga/ is
# staged 1:1 to /roms/kick/ on the SD card (flat, original names kept). The
# kernel scans /roms/kick (falling back to legacy /kick) for
# kick34005.A500 / kick37175.A500 / kick40063.A600 / kick40068.A1200 /
# aros-amiga-m68k-rom.bin and boots zero-config from the compiled-in
# DiagROM when nothing matches.
[[both.tree]]
from = "repo/roms/amiga"
to = "roms/kick"
mode = "keep"
exclude = ["README.txt"]

# Genuine TOS pool for the ATARIST machine. Everything in repo roms/tos/ is
# staged 1:1 to /roms/tos/ on the SD card (canonical names tos106uk.img /
# tos162uk.img / tos206uk.img). tools/download_roms.py fills this pool
# from archive.org; empty is fine (EmuTOS default still boots).
[[both.tree]]
from = "repo/roms/tos"
to = "roms/tos"
mode = "keep"
exclude = ["README.txt", "etos512uk.img"]

